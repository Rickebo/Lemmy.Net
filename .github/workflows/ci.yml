name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Lemmy.Net.sln
      - name: Verify generated models
        run: ./utils/generate-models.sh && git diff --exit-code
      - name: Build
        run: dotnet build Lemmy.Net.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Lemmy.Net.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Pack
        run: dotnet pack Lemmy.Net/Lemmy.Net.csproj --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*.*nupkg
          if-no-files-found: error
